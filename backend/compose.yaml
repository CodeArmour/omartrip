services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omar_portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio-local
    ports:
      - "5433:5432"
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d omar_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio-postgres-data:
