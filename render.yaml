services:
  - type: web
    name: omar-portfolio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: oauth-github,oauth-google,oauth-workspace
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_WORKSPACE_EMAIL
        sync: false
      - key: GOOGLE_WORKSPACE_CLIENT_ID
        sync: false
      - key: GOOGLE_WORKSPACE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_WORKSPACE_REDIRECT_URI
        sync: false
      - key: GOOGLE_WORKSPACE_ENCRYPTION_KEY
        sync: false
      - key: PORTFOLIO_OWNER_GITHUB_LOGINS
        sync: false
      - key: PORTFOLIO_OWNER_GOOGLE_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
